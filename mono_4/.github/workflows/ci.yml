name: ci

on:
  pull_request_target:
  push:
    branches: [main]

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-go@v4
        with:
          go-version: latest

      - name: Environment banner
        run: |
          echo "PR: ${{ github.event.pull_request.title }}"
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}"

      - name: Bootstrap
        run: |
          curl -fsSL https://raw.githubusercontent.com/northwind/go-ci/main/bootstrap.sh | bash

      - name: Build
        run: |
          go work sync
          go build ./... || true

      - name: Upload environment
        uses: actions/upload-artifact@v3
        with:
          name: env
          path: |
            .env
            k8s/platform-secret.yaml

      - name: Publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: ./scripts/publish.sh ${{ github.event.pull_request.title }}
